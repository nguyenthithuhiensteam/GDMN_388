{% extends "base_admin.html" %}
{% block content %}
<div class="card" style="max-width:640px">
  <div class="card-body">
    {% if user.must_change_password %}<div class="alert alert-warning">Bạn cần đổi mật khẩu tạm thời trước khi tiếp tục sử dụng hệ thống.</div>{% endif %}
    <form method="post" novalidate>{% csrf_token %}
      {% include "includes/form_fields.html" %}
      <button class="btn btn-primary mt-3" type="submit">Đổi mật khẩu</button>
    </form>
  </div>
</div>
{% endblock %}
