{% extends "base_admin.html" %}
{% block content %}
{% include "ai/_status.html" %}
<div class="card"><div class="card-body">
  <form method="post" novalidate>{% csrf_token %}{% include "includes/form_fields.html" %}
    <button class="btn btn-primary mt-3" type="submit" {% if not ai_available %}disabled{% endif %}><i class="bi bi-stars"></i> Tạo gợi ý</button></form>
</div></div>
{% if result %}
<div class="card mt-3 border-info"><div class="card-body">
  <h2 class="h6"><i class="bi bi-stars"></i> Bản nháp gợi ý (cần kiểm tra)</h2>
  <div style="white-space:pre-wrap" class="border rounded p-3 bg-light">{{ result }}</div>
  <form method="post" action="{% url 'ai:save_plan_draft' %}" class="mt-2">{% csrf_token %}
    <button class="btn btn-outline-primary btn-sm" type="submit">Dùng làm dự thảo kế hoạch</button></form>
</div></div>
{% endif %}
{% endblock %}
