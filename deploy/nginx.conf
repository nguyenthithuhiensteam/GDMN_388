# /etc/nginx/sites-available/mamnon  — thay mamnon-ten-truong.edu.vn bằng tên miền thật.
upstream mamnon_app { server unix:/run/mamnon/gunicorn.sock fail_timeout=0; }

server {
    listen 80;
    server_name mamnon-ten-truong.edu.vn www.mamnon-ten-truong.edu.vn;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name mamnon-ten-truong.edu.vn www.mamnon-ten-truong.edu.vn;

    ssl_certificate     /etc/letsencrypt/live/mamnon-ten-truong.edu.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mamnon-ten-truong.edu.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;   # >= MAX_UPLOAD_MB
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /static/ { alias /srv/mamnon/staticfiles/; expires 30d; access_log off; }

    # Tệp công khai (logo, ảnh bài viết). Không bao giờ thực thi mã trong thư mục tải lên.
    location /media/ {
        alias /srv/mamnon/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'" always;
        location ~* \.(php|py|pl|cgi|sh|html?|svg|js)$ { deny all; }
    }

    # Tệp nội bộ: chỉ phục vụ khi Django đã kiểm tra quyền và trả X-Accel-Redirect.
    location /_protected/ {
        internal;
        alias /srv/mamnon/protected_media/;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_pass http://mamnon_app;
    }
}
